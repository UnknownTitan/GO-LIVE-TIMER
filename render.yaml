# Render Blueprint: one web service (API + built frontend + reminder job) and a PostgreSQL database.
# In Render: New > Blueprint, pick this repository, then fill in ADMIN_EMAIL and ADMIN_PASSWORD.
services:
  - type: web
    name: clet-go-live
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: clet-go-live-db
          property: connectionString
      # First admin account, created on start-up if it does not exist yet (password: 12+ characters).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin
      # Daily 18:00 reminder. Without SMTP_HOST, messages are only written to the logs.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: clet-go-live-db
    region: frankfurt
    plan: free
    databaseName: golive
    user: golive
